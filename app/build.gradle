plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'tj.orion.recorder'
    compileSdk 35

    defaultConfig {
        applicationId 'tj.orion.recorder'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Offline Russian speech-to-text. Pulls JNA, no AndroidX.
    implementation 'com.alphacephei:vosk-android:0.3.47'
}
