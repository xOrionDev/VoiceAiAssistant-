plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'tj.orion.recorder'
    compileSdk 34

    defaultConfig {
        applicationId 'tj.orion.recorder'
        minSdk 26
        targetSdk 34
        versionCode (project.hasProperty('vCode') ? project.vCode.toInteger() : 1)
        versionName (project.hasProperty('vName') ? project.vName : '1.0')
    }

    signingConfigs {
        app {
            storeFile file('keystore.jks')
            storePassword 'voiceai123'
            keyAlias 'voiceai'
            keyPassword 'voiceai123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.app
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.app
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Offline Russian speech-to-text. Pulls JNA, no AndroidX.
    implementation 'com.alphacephei:vosk-android:0.3.47'
}
